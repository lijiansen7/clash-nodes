name: Update Clash Nodes

on:
  schedule:
    # 每 6 小时自动更新一次 (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write # 允许把生成的订阅文件推送回仓库

env:
  PYTHONIOENCODING: utf-8 # 保证中文日志在 Windows runner 上正常输出
  PYTHONUTF8: "1"

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install requests pyyaml cryptography

      - name: 下载 mihomo 内核
        env:
          GH_PROXY: "" # CI 直连 GitHub, 不需要加速器
        run: python get_mihomo.py

      - name: 测试节点并生成订阅
        env:
          GH_PROXY: ""
        run: python clash_node_tester.py --engine mihomo --gh-proxy "" --export-proxy-ok mihomo_alive.yaml

      - name: 提交并推送订阅文件
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update nodes $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
